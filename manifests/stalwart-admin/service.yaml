# Generated by scripts/gen_service_yaml.py from the server's tool list. Do not edit by hand.
# MCP hub manifest: admin tools on the same sidecar.
name: stalwart-admin
version: 0.1.0
type: managed
enabled: true
url: ${STALWART_MCP_URL}
healthEndpoint: /health
env:
  STALWART_MCP_URL:
    required: true
    description: 'URL of the sidecar on the hub network: http://stalwart-mcp:8000 (the `stalwart` service''s sidecar)'
credentials:
  methods:
  - per_user
  label: Stalwart admin API key
  helpText: Each administrator creates their own API key in Stalwart (Account › Credentials › API Keys), restricted to the
    hub's IP addresses. Never share keys.
  tutorial:
    steps:
    - text: Sign in to Stalwart with your administrator account and open Account › Credentials › API Keys.
    - text: Create a key named 'MCP Hub' with permissions Inherit, allowed IPs = the hub server's addresses, and an expiry
        date. The secret (API_…) is shown once.
    - text: 'Paste the key:'
      input:
        key: token
        label: API key
        type: password
    combine: '{token}'
  testEndpoint:
    method: GET
    path: ${STALWART_MCP_URL}/auth-check
    headers:
      Authorization: Bearer {{credential}}
    expectStatus: 200
tools:
- name: stalwart-admin.admin_info
  title: Admin Info
  description: 'Who am I as administrator: login, edition and the management permissions of this credential.'
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  mcpProxy:
    remoteName: admin_info
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.list_accounts
  title: List Accounts
  description: Accounts and groups with address, display name, aliases, quota/usage, admin flag, disabled state and groups.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      text:
        type: string
        description: Search in names, display names and aliases.
      domain:
        type: string
      kind:
        type: string
        enum:
        - User
        - Group
      limit:
        type: integer
        description: 'Default: 100.'
      position:
        type: integer
        description: 'Default: 0.'
  mcpProxy:
    remoteName: list_accounts
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.get_account
  title: Get Account
  description: One account in detail, including its credentials (password, app passwords, API keys — never the secrets).
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      account:
        type: string
        description: Account address (name@domain) or account id.
    required:
    - account
  mcpProxy:
    remoteName: get_account
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.create_account
  title: Create Account
  description: 'Create a user (or group) mailbox. Optional: display name, aliases, quota (''5 GB''), groups, admin role. Password:
    pass one, set generate_password=true (returned once), or leave both out (no login until set).'
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      address:
        type: string
        description: Primary address, e.g. jane@example.com.
      kind:
        type: string
        enum:
        - User
        - Group
        description: 'Default: User.'
      display_name:
        type: string
      password:
        type: string
      generate_password:
        type: boolean
        description: 'Default: False.'
      aliases:
        type: array
        items:
          type: string
      quota:
        type: string
        description: Disk quota, e.g. '5 GB'.
      groups:
        type: array
        items:
          type: string
      admin:
        type: boolean
        description: 'Default: False.'
    required:
    - address
  mcpProxy:
    remoteName: create_account
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.update_account
  title: Update Account
  description: Change display name, aliases, quota ('none' removes it), groups, admin role, enabled state (disabled = no login,
    mail is still delivered) or reset the password (generated and returned once, or given).
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      account:
        type: string
        description: Account address (name@domain) or account id.
      display_name:
        type: string
      add_aliases:
        type: array
        items:
          type: string
      remove_aliases:
        type: array
        items:
          type: string
      quota:
        type: string
      add_groups:
        type: array
        items:
          type: string
      remove_groups:
        type: array
        items:
          type: string
      admin:
        type: boolean
      enabled:
        type: boolean
      reset_password:
        type: boolean
        description: 'Default: False.'
      new_password:
        type: string
    required:
    - account
  mcpProxy:
    remoteName: update_account
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.delete_account
  title: Delete Account
  description: Delete an account and all its mail (purged in the background). confirm_address must repeat the address.
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      account:
        type: string
        description: Account address (name@domain) or account id.
      confirm_address:
        type: string
    required:
    - account
    - confirm_address
  mcpProxy:
    remoteName: delete_account
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.list_domains
  title: List Domains
  description: Mail domains with aliases, enabled state and DKIM/DNS/certificate management mode; include_dkim adds the DKIM
    keys.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      text:
        type: string
      include_dkim:
        type: boolean
        description: 'Default: False.'
  mcpProxy:
    remoteName: list_domains
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.get_domain_dns
  title: Get Domain DNS Records
  description: All DNS records a domain needs (MX, SPF, DKIM, DMARC, MTA-STS, TLS-RPT, SRV, autoconfig) as BIND zone text.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      domain:
        type: string
    required:
    - domain
  mcpProxy:
    remoteName: get_domain_dns
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.create_domain
  title: Create Domain
  description: Add a mail domain. With automatic_dkim (default) Stalwart generates DKIM keys in the background; afterwards
    get_domain_dns returns the records to publish.
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      name:
        type: string
      description:
        type: string
      automatic_dkim:
        type: boolean
        description: 'Default: True.'
    required:
    - name
  mcpProxy:
    remoteName: create_domain
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.delete_domain
  title: Delete Domain
  description: Delete a domain (fails while accounts or lists use it). confirm_name must repeat the domain name.
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      name:
        type: string
      confirm_name:
        type: string
    required:
    - name
    - confirm_name
  mcpProxy:
    remoteName: delete_domain
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.list_mailing_lists
  title: List Mailing Lists
  description: Mailing lists (distribution addresses) with their recipients and aliases.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      text:
        type: string
  mcpProxy:
    remoteName: list_mailing_lists
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.manage_mailing_list
  title: Manage Mailing List
  description: create (address, add_recipients), update (add/remove recipients, description) or delete (confirm_address must
    repeat the address) a mailing list.
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      action:
        type: string
        enum:
        - create
        - update
        - delete
      address:
        type: string
      add_recipients:
        type: array
        items:
          type: string
      remove_recipients:
        type: array
        items:
          type: string
      description:
        type: string
      confirm_address:
        type: string
    required:
    - action
    - address
  mcpProxy:
    remoteName: manage_mailing_list
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.list_queue
  title: List Outbound Queue
  description: Messages waiting for delivery, next due first, with per-recipient status and last error.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      recipient:
        type: string
      sender:
        type: string
      text:
        type: string
      due_before:
        type: string
      limit:
        type: integer
        description: 'Default: 50.'
  mcpProxy:
    remoteName: list_queue
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.queue_action
  title: Queue Action
  description: retry_now / reschedule (at) / cancel (whole messages, or one recipient of one message) for queued messages,
    or pause / resume all outbound delivery.
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      action:
        type: string
        enum:
        - retry_now
        - reschedule
        - cancel
        - pause
        - resume
      ids:
        type: array
        items:
          type: string
      recipient:
        type: string
      at:
        type: string
    required:
    - action
  mcpProxy:
    remoteName: queue_action
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.list_ips
  title: List Blocked/Allowed IPs
  description: IP addresses Stalwart blocks (auto-bans included, with reason and expiry) and the allowed list.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      kind:
        type: string
        enum:
        - both
        - blocked
        - allowed
        description: 'Default: both.'
      address:
        type: string
        description: Exact IP or CIDR.
  mcpProxy:
    remoteName: list_ips
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.manage_ip
  title: Manage IP Lists
  description: unblock (lift a ban), block, allow (never ban, no rate limits) or unallow an IP/CIDR. Reloads the running server's
    list afterwards. Allowing an IP disables brute-force protection for it.
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      action:
        type: string
        enum:
        - unblock
        - block
        - allow
        - unallow
      address:
        type: string
      reason:
        type: string
      expires:
        type: string
        description: Expiry (YYYY-MM-DD or ISO 8601); empty = permanent.
    required:
    - action
    - address
  mcpProxy:
    remoteName: manage_ip
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.list_reports
  title: List DMARC/TLS Reports
  description: 'Received DMARC aggregate or TLS-RPT reports, summarised: reporter, period, volume, failing sources. domain
    filters by policy/sender domain; full=true returns raw report objects.'
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      kind:
        type: string
        enum:
        - dmarc
        - tls
        description: 'Default: dmarc.'
      domain:
        type: string
      since:
        type: string
      limit:
        type: integer
        description: 'Default: 30.'
      full:
        type: boolean
        description: 'Default: False.'
  mcpProxy:
    remoteName: list_reports
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.search_logs
  title: Search Server Logs
  description: Server log entries, newest first. text is a case-sensitive substring of the log line, e.g. '(auth.failed)'
    or an IP. Page with next_anchor.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      text:
        type: string
      limit:
        type: integer
        description: 'Default: 50.'
      anchor:
        type: string
  mcpProxy:
    remoteName: search_logs
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.list_tasks
  title: List Background Tasks
  description: Pending, retrying and failed background tasks (DKIM, DNS, ACME, spam training, account maintenance).
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      failed_only:
        type: boolean
        description: 'Default: False.'
      task_type:
        type: string
      limit:
        type: integer
        description: 'Default: 50.'
  mcpProxy:
    remoteName: list_tasks
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.run_task
  title: Run Background Task
  description: 'Schedule SpamFilterMaintenance (maintenance: train/retrain), DkimManagement or DnsManagement or AcmeRenewal
    (domain), or AccountMaintenance (account; maintenance: recalculateQuota/reindex/purge).'
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      task_type:
        type: string
        enum:
        - SpamFilterMaintenance
        - DkimManagement
        - DnsManagement
        - AcmeRenewal
        - AccountMaintenance
      domain:
        type: string
      account:
        type: string
      maintenance:
        type: string
      records:
        type: array
        description: 'DnsManagement: record types, e.g. [''dkim'',''mx''].'
        items:
          type: string
    required:
    - task_type
  mcpProxy:
    remoteName: run_task
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.run_action
  title: Run Server Action
  description: ReloadSettings (after config changes), ReloadTlsCertificates, ReloadBlockedIps, ReloadLookupStores, InvalidateCaches,
    InvalidateNegativeCaches, PauseMtaQueue, ResumeMtaQueue.
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      action_type:
        type: string
        enum:
        - ReloadSettings
        - ReloadTlsCertificates
        - ReloadBlockedIps
        - ReloadLookupStores
        - InvalidateCaches
        - InvalidateNegativeCaches
        - PauseMtaQueue
        - ResumeMtaQueue
    required:
    - action_type
  mcpProxy:
    remoteName: run_action
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.diagnose
  title: Diagnose Message
  description: 'kind=''dmarc'': evaluate SPF/DKIM/DMARC as if a message arrived from remote_ip with this EHLO and MAIL FROM
    (raw message optional, needed for DKIM). kind=''spam'': run the spam classifier on a raw message.'
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      kind:
        type: string
        enum:
        - dmarc
        - spam
      remote_ip:
        type: string
      ehlo_domain:
        type: string
      mail_from:
        type: string
      message:
        type: string
        description: Raw RFC 5322 message.
      recipients:
        type: array
        items:
          type: string
    required:
    - kind
    - remote_ip
    - ehlo_domain
    - mail_from
  mcpProxy:
    remoteName: diagnose
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.query_objects
  title: Query Any Management Object
  description: 'Read any Stalwart management object type (e.g. MtaRoute, Security, SystemSettings, Role, DkimSignature) by
    ids or filter (AND only). Types and fields: https://stalw.art/docs/ref/'
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      type:
        type: string
        description: 'Object type without the x: prefix, e.g. ''MtaRoute''.'
      ids:
        type: array
        items:
          type: string
      filter:
        type: object
      properties:
        type: array
        items:
          type: string
      limit:
        type: integer
        description: 'Default: 50.'
    required:
    - type
  mcpProxy:
    remoteName: query_objects
    url: /admin/mcp
    passthrough: true
- name: stalwart-admin.set_object
  title: Change Any Management Object
  description: 'Create, update (JSON-pointer patches allowed) or destroy any management object. Expert tool: Lists are objects
    keyed ''0'',''1'',…, sets are {value: true}, durations in ms. reload=true runs ReloadSettings (ReloadBlockedIps for BlockedIp)
    afterwards. Prefer the specific tools.'
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false
  inputSchema:
    type: object
    properties:
      type:
        type: string
      create:
        type: object
      update:
        type: object
      destroy:
        type: array
        items:
          type: string
      reload:
        type: boolean
        description: 'Default: False.'
    required:
    - type
  mcpProxy:
    remoteName: set_object
    url: /admin/mcp
    passthrough: true
